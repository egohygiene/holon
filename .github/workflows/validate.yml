name: Validate Holon

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-holon-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python3 -m compileall -q tools tests

      - name: Run contract and materialization tests
        run: python3 -m unittest discover --start-directory tests --pattern "test_*.py" --verbose

      - name: Validate JSON contracts and examples
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          for root in (Path("catalog"), Path("examples"), Path("schemas")):
              for path in sorted(root.rglob("*.json")):
                  json.loads(path.read_text(encoding="utf-8"))
                  print(f"valid JSON: {path}")
          PY
