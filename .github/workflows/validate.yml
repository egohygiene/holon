name: Validate Holon

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-holon-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check out pinned Aether continuity contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: egohygiene/aether
          ref: b7597301c4d22a9bcd580967b5753138bb368111
          path: .continuity-sources/aether
          persist-credentials: false

      - name: Check out pinned Hygiene continuity policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: egohygiene/hygiene
          ref: 43386f5749116717585ead7459b4945e0ac50d06
          path: .continuity-sources/hygiene
          persist-credentials: false

      - name: Check out pinned EgoLint continuity validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: egohygiene/egolint
          ref: 786f1b3c59748a66bb092cad9589640f01c5b41d
          path: .continuity-sources/egolint
          persist-credentials: false

      - name: Check out pinned Antidote migration source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: egohygiene/antidote
          ref: f9e23128a660066b3f64c73c4dd2d36554b6040a
          path: .continuity-sources/antidote
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Activate the blueprint package manager
        shell: bash
        run: |
          corepack prepare "pnpm@11.24.0" --activate
          corepack_directory="${RUNNER_TEMP}/corepack-bin"
          mkdir -p "${corepack_directory}"
          corepack enable --install-directory "${corepack_directory}"
          echo "${corepack_directory}" >> "${GITHUB_PATH}"

      - name: Compile Python sources
        run: python3 -m compileall -q tools tests

      - name: Build the pinned EgoLint continuity validator
        working-directory: .continuity-sources/egolint
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.continuity-build/egolint
        run: cargo build --locked --bin "egolint"

      - name: Run contract and materialization tests
        run: python3 -m unittest discover --start-directory tests --pattern "test_*.py" --verbose

      - name: Validate the repository-continuity materialization profile
        run: python3 tools/repository_continuity_profile.py validate

      - name: Prove repository-continuity materialization across repository classes
        run: >-
          python3 tools/check_repository_continuity_fixtures.py
          --aether-source .continuity-sources/aether
          --hygiene-source .continuity-sources/hygiene
          --egolint-source .continuity-sources/egolint
          --egolint-binary .continuity-build/egolint/debug/egolint
          --antidote-source .continuity-sources/antidote

      - name: Prove Holon's repository-continuity CLI dogfood
        run: >-
          python3 tools/check_repository_continuity_dogfood.py
          --aether-source .continuity-sources/aether

      - name: Validate the React/Vite blueprint contract
        run: python3 tools/react_vite_blueprint.py

      - name: Prove a clean React/Vite consumer
        run: python3 tools/check_react_vite_fixture.py

      - name: Validate the LaunchKit blueprint contract
        run: python3 tools/launchkit_blueprint.py

      - name: Prove both clean LaunchKit consumers
        run: python3 tools/check_launchkit_fixtures.py

      - name: Validate repository-presentation profiles and Mantle canary
        run: python3 tools/repository_presentation_blueprint.py validate-fixtures

      - name: Validate the public site-suite blueprint contract
        run: python3 tools/site_suite_blueprint.py

      - name: Prove generic and LaunchKit public site suites
        run: python3 tools/check_site_suite_fixtures.py

      - name: Run Repository Intelligence component tests
        run: npm test

      - name: Validate JSON contracts and examples
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          for root in (Path("catalog"), Path("examples"), Path("schemas")):
              for path in sorted(root.rglob("*.json")):
                  json.loads(path.read_text(encoding="utf-8"))
                  print(f"valid JSON: {path}")
          PY
