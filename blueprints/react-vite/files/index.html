<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{parameter_html.site_description}}" />
    <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17171a" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="{{parameter_html.canonical_url}}" />
    <link rel="manifest" href="{{parameter_html.site_base_path}}site.webmanifest" />
    <title>{{parameter_html.site_title}}</title>
  </head>
  <body>
    <div id="root">
      <noscript>
        <main>
          <h1>{{parameter_html.site_title}}</h1>
          <p>{{parameter_html.site_description}}</p>
          <p>This site remains readable, but interactive navigation requires JavaScript.</p>
        </main>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
